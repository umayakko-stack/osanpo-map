<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2e8b57">
<title>おさんぽマップ 🚶</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>

<!-- ヘッダー -->
<header id="header">
  <span class="logo">🚶 おさんぽマップ</span>
  <span id="gps-status" class="gps-status">GPS待機中</span>
</header>

<!-- さんぽ画面 -->
<main id="tab-walk" class="tab-page active">
  <div id="walk-map" class="map"></div>

  <!-- 1日の目標歩数の進捗（タップで目標を変更。未設定時は下のボタンを表示） -->
  <div id="step-goal-bar" class="step-goal-bar hidden">
    <div id="step-goal-text" class="step-goal-text"></div>
    <div class="step-goal-track"><div id="step-goal-fill" class="step-goal-fill"></div></div>
  </div>
  <button id="btn-set-step-goal" class="step-goal-set hidden">🎯 1日の目標歩数をきめる</button>

  <div id="live-stats" class="live-stats hidden">
    <div class="stat"><span class="stat-value" id="stat-time">0:00</span><span class="stat-label">時間</span></div>
    <div class="stat"><span class="stat-value" id="stat-dist">0.00</span><span class="stat-label">km</span></div>
    <div class="stat"><span class="stat-value" id="stat-steps">0</span><span class="stat-label">歩</span></div>
    <button id="btn-dim" class="btn-dim" title="省電力画面">🔋</button>
  </div>

  <div id="walk-hint" class="walk-hint hidden"></div>

  <button id="btn-walk" class="btn-walk">さんぽ<br>スタート</button>

  <!-- ステッパー運動（タイマーで記録） -->
  <button id="btn-stepper" class="btn-stepper">🦵<br>ステッパー</button>

  <div id="stepper-overlay" class="walk-done-overlay hidden">
    <div class="walk-done-card">
      <!-- 時間えらび（ルーレット） -->
      <div id="stepper-setup">
        <h3>🦵 ステッパーうんどう</h3>
        <div class="cond-q">ルーレットで時間をきめよう！</div>
        <div class="roulette-wrap">
          <div class="roulette-pointer">▼</div>
          <svg id="roulette-wheel" viewBox="-100 -100 200 200">
            <path d="M0 0 L0 -90 A90 90 0 0 1 90 0 Z" fill="#2e8b57"/>
            <path d="M0 0 L90 0 A90 90 0 0 1 0 90 Z" fill="#ff8c42"/>
            <path d="M0 0 L0 90 A90 90 0 0 1 -90 0 Z" fill="#4a90d9"/>
            <path d="M0 0 L-90 0 A90 90 0 0 1 0 -90 Z" fill="#e05252"/>
            <text x="38.9" y="-38.9" class="roulette-label">1分</text>
            <text x="38.9" y="38.9" class="roulette-label">2分</text>
            <text x="-38.9" y="38.9" class="roulette-label">3分</text>
            <text x="-38.9" y="-38.9" class="roulette-label">4分</text>
            <circle cx="0" cy="0" r="12" fill="#fff"/>
            <text x="0" y="0" class="roulette-center">🦵</text>
          </svg>
        </div>
        <div id="roulette-result" class="roulette-result"></div>
        <button id="btn-spin" class="btn-close">🎲 ルーレットをまわす！</button>
        <div class="stepper-sub">
          <button id="stepper-custom" class="btn-close btn-gray">じぶんで決める</button>
          <button id="stepper-cancel" class="btn-close btn-gray">やめておく</button>
        </div>
      </div>
      <!-- カウントダウン -->
      <div id="stepper-run" class="hidden">
        <h3>🦵 うんどう中…</h3>
        <div id="stepper-remain" class="stepper-remain">0:00</div>
        <div class="stepper-note">おわったら音でお知らせして<br>きろく画面に追加します</div>
        <button id="stepper-stop" class="btn-close btn-red">とちゅうでおわる</button>
      </div>
      <!-- 記録確認 -->
      <div id="stepper-done" class="hidden">
        <h3>🎉 おつかれさまでした！</h3>
        <div id="stepper-done-time" class="done-stats"></div>
        <label class="field-label">歩数 ※ステッパーのカウンター表示に合わせて直せます
          <input type="number" id="stepper-steps-input" min="0" max="100000" inputmode="numeric">
        </label>
        <div class="stepper-done-btns">
          <button id="stepper-save" class="btn-close">記録する</button>
          <button id="stepper-discard" class="btn-close btn-gray">記録しない</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 省電力画面（黒画面・タップで戻る） -->
  <div id="dim-overlay" class="dim-overlay hidden">
    <div class="dim-time" id="dim-time">0:00</div>
    <div class="dim-row"><span id="dim-dist">0.00</span> km ・ <span id="dim-steps">0</span> 歩</div>
    <div class="dim-note">きろく中 🚶 タップで画面に戻る</div>
  </div>
</main>

<!-- きろく画面 -->
<main id="tab-history" class="tab-page">
  <div class="page-inner">
    <h2>📖 さんぽのきろく</h2>
    <div id="history-summary" class="summary-cards"></div>

    <div class="cond-card">
      <div id="cond-title" class="cond-title">きょうの体調・体重</div>
      <div class="cond-btns" id="cond-btns">
        <button data-cond="good"><span class="face face-good">😊</span><span>良い</span></button>
        <button data-cond="normal"><span class="face">😐</span><span>普通</span></button>
        <button data-cond="bad"><span class="face face-bad">😞</span><span>悪い</span></button>
      </div>
      <div class="weight-row">
        <span class="weight-label">⚖️ 体重</span>
        <input type="number" id="weight-input" step="0.1" min="20" max="200" placeholder="--.-" inputmode="decimal">
        <span class="weight-unit">kg</span>
        <button id="btn-weight-save" class="btn-small">記録</button>
      </div>
    </div>

    <div class="calendar-card">
      <div class="cal-header">
        <button id="cal-prev" class="cal-nav">‹</button>
        <div id="cal-title" class="cal-title"></div>
        <button id="cal-next" class="cal-nav">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="weight-card hidden" id="weight-card">
      <div class="weight-title">⚖️ 体重のうつりかわり</div>
      <svg id="weight-chart" viewBox="0 0 300 110"></svg>
    </div>

    <div id="list-filter-bar" class="list-filter hidden"></div>
    <ul id="history-list" class="history-list"></ul>
  </div>
</main>

<!-- もくひょう画面 -->
<main id="tab-goal" class="tab-page">
  <div class="page-inner">
    <h2>🌍 もくひょう</h2>

    <label class="field-label">どこまで歩く？
      <select id="goal-select"></select>
    </label>

    <div class="custom-goal">
      <button id="btn-add-goal" class="btn-small">＋ じぶんの目標地点をつくる</button>
      <div id="custom-goal-box" class="custom-goal-box hidden">
        <div class="custom-goal-row">
          <input type="text" id="goal-search-input" placeholder="地名を入力（例: 京都駅、富士山）">
          <button id="btn-goal-search" class="btn-small">さがす</button>
        </div>
        <ul id="goal-search-results" class="goal-results"></ul>
      </div>
      <button id="btn-del-goal" class="btn-small btn-danger hidden">🗑 いまのカスタム目標を削除</button>
    </div>

    <div id="goal-progress-card" class="goal-card">
      <div id="goal-title" class="goal-title"></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="goal-text" class="goal-text"></div>
    </div>

    <div id="goal-map" class="goal-map"></div>

    <details class="settings">
      <summary>⚙️ せってい</summary>
      <label class="field-label">歩幅（cm）※歩数の推定に使います
        <input type="number" id="stride-input" min="30" max="120" step="1">
      </label>
      <label class="field-label">1日の目標歩数 ※さんぽ画面に進捗バーが出ます（0または空欄でオフ）
        <input type="number" id="step-goal-input" min="0" max="100000" step="500" placeholder="例: 8000" inputmode="numeric">
      </label>
      <label class="field-label">出発地点
        <button id="btn-set-home" class="btn-small">現在地を出発地点にする</button>
        <span id="home-text" class="home-text"></span>
      </label>
      <label class="field-label checkbox-label">
        <input type="checkbox" id="plain-map-toggle">
        🗺️ 地図をうすい色にする（無地ふう）
      </label>
      <div class="field-label backup-section">💾 データのバックアップ・復元
        <div id="backup-info" class="backup-info"></div>
        <div class="backup-btns">
          <button id="btn-backup-save" class="btn-small">💾 ファイルに保存</button>
          <button id="btn-backup-copy" class="btn-small">📋 コピーする</button>
          <button id="btn-restore-file" class="btn-small">📂 ファイルから復元</button>
          <button id="btn-restore-paste" class="btn-small">📝 貼り付けて復元</button>
        </div>
        <input type="file" id="restore-file-input" accept=".json,application/json,text/plain" hidden>
        <div id="restore-paste-box" class="restore-paste-box hidden">
          <textarea id="restore-textarea" rows="4" placeholder="ここにバックアップの文字を貼り付けてください"></textarea>
          <button id="btn-restore-run" class="btn-small">この内容で復元する</button>
        </div>
      </div>
    </details>
  </div>
</main>

<!-- タブバー -->
<nav id="tabbar">
  <button class="tab-btn active" data-tab="walk">🚶<span>さんぽ</span></button>
  <button class="tab-btn" data-tab="history">📖<span>きろく</span></button>
  <button class="tab-btn" data-tab="goal">🌍<span>もくひょう</span></button>
</nav>

<script src="leaflet.js"></script>
<script src="capacitor-bundle.js?v=17"></script>
<script src="app.js?v=18"></script>
</body>
</html>
